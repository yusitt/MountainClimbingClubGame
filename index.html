<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>登山社博覽會｜攻頂挑戰</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --sky-top:#ffe6b8;
    --sky-mid:#ffd3a8;
    --sky-bottom:#bfe6ee;
    --mountain-far:#8fb6a3;
    --mountain-mid:#5c9481;
    --mountain-near:#356153;
    --forest-deep:#1f4d3d;
    --trail:#c9a877;
    --trail-edge:#8b6b3f;
    --accent-flag:#e8542a;
    --accent-gold:#f2b134;
    --ink:#20301f;
    --card-bg:#fff8ea;
    --wood:#8b5e34;
    --wood-dark:#6b4423;
    --correct:#3fae57;
    --wrong:#e6483a;
    --paper-shadow:rgba(31,77,61,.35);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0;padding:0;width:100%;height:100%;overflow:hidden;
    font-family:'Noto Sans TC',sans-serif;
    color:var(--ink);
    touch-action:manipulation;
    user-select:none;
  }
  #stage{
    position:fixed;inset:0;
    background:linear-gradient(180deg,var(--sky-top) 0%, var(--sky-mid) 38%, var(--sky-bottom) 100%);
    overflow:hidden;
  }
  /* ---------- decorative sky ---------- */
  .sun{
    position:absolute;top:6%;right:10%;width:9vmin;height:9vmin;border-radius:50%;
    background:radial-gradient(circle at 35% 35%, #fff6d8, var(--accent-gold) 70%);
    box-shadow:0 0 6vmin 1vmin rgba(242,177,52,.35);
  }
  .cloud{
    position:absolute;background:#ffffff;opacity:.75;border-radius:50%;
    filter:blur(.5px);
  }
  /* ---------- header banner ---------- */
  #banner{
    position:absolute;top:2.2vh;left:2.2vh;z-index:20;
    background:var(--wood);
    color:#fff8ea;
    padding:1.1vh 2.4vh;
    border-radius:6px;
    font-family:'Baloo 2',sans-serif;
    font-weight:700;
    font-size:clamp(14px,2.4vh,22px);
    box-shadow:0 4px 0 var(--wood-dark), 0 8px 14px rgba(0,0,0,.25);
    display:flex;align-items:center;gap:.6em;
    letter-spacing:.02em;
  }
  #banner .peg{width:.5em;height:.5em;border-radius:50%;background:#3a2413;display:inline-block;box-shadow:0 0 0 2px #d8c7a3 inset;}
  /* ---------- progress flags top-right ---------- */
  #progress{
    position:absolute;top:2.2vh;right:2.2vh;z-index:20;
    display:flex;gap:1vh;
    background:rgba(255,248,234,.88);
    padding:1vh 1.4vh;border-radius:10px;
    box-shadow:0 3px 10px rgba(0,0,0,.15);
  }
  #progress .dot{
    width:3.4vh;height:3.4vh;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-size:1.7vh;background:#e9e0c9;color:#8b7a52;
    border:2px solid #d8c7a3;
    transition:all .35s ease;
    font-weight:700;
  }
  #progress .dot.done{background:var(--correct);border-color:#2d8843;color:#fff;}
  #progress .dot.active{background:var(--accent-flag);border-color:#b8391a;color:#fff;transform:scale(1.15);}
  /* ---------- fullscreen btn ---------- */
  #fsBtn{
    position:absolute;bottom:2.2vh;right:2.2vh;z-index:20;
    background:var(--forest-deep);color:#eafff0;border:none;
    padding:1.2vh 1.8vh;border-radius:8px;font-size:1.6vh;
    font-family:'Noto Sans TC',sans-serif;font-weight:700;cursor:pointer;
    box-shadow:0 3px 0 #0f2e22;
  }
  #fsBtn:active{transform:translateY(2px);box-shadow:0 1px 0 #0f2e22;}
  /* ---------- control bar (pause / start / restart) ---------- */
  #controlBar{
    position:absolute;bottom:2.2vh;left:50%;transform:translateX(-50%);
    z-index:50;
    display:flex;gap:1.2vh;
    background:rgba(20,30,20,.55);
    padding:1vh 1.2vh;border-radius:50px;
    backdrop-filter:blur(4px);
  }
  .ctrl-btn{
    display:flex;align-items:center;gap:.6vh;
    font-family:'Baloo 2',sans-serif;font-weight:700;
    border:none;border-radius:50px;cursor:pointer;
    padding:1.2vh 2vh;font-size:clamp(13px,1.8vh,17px);
    box-shadow:0 3px 0 rgba(0,0,0,.3);
    transition:transform .1s, opacity .2s;
  }
  .ctrl-btn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.3);}
  .ctrl-btn:disabled{
    opacity:.35;cursor:not-allowed;box-shadow:none;transform:none;
  }
  #playBtn{background:var(--correct);color:#fff;}
  #pauseBtn{background:var(--accent-gold);color:#3a2b06;}
  #restartCtrlBtn{background:var(--wood);color:#fff8ea;}
  /* ---------- pause overlay ---------- */
  #pauseOverlay{
    position:absolute;inset:0;z-index:45;
    display:none;
    align-items:center;justify-content:center;
    background:rgba(15,25,18,.55);
    backdrop-filter:blur(2px);
  }
  #pauseOverlay.show{display:flex;}
  #pauseCard{
    background:var(--card-bg);
    border:6px solid var(--accent-gold);
    border-radius:14px;
    padding:3.2vh 5vh;
    text-align:center;
    box-shadow:0 20px 40px rgba(0,0,0,.4);
    animation:signIn .3s cubic-bezier(.2,1.4,.4,1);
  }
  #pauseCard h3{
    font-family:'Baloo 2',sans-serif;font-size:clamp(20px,3.4vh,30px);
    color:var(--forest-deep);margin:0 0 .6vh;
  }
  #pauseCard p{font-size:clamp(12px,1.8vh,15px);color:#5a4c30;margin:0;}
  /* ---------- svg trail ---------- */
  svg#trailSvg{position:absolute;inset:0;width:100%;height:100%;display:block;}
  .mountain-far{fill:var(--mountain-far);opacity:.55;}
  .mountain-mid{fill:var(--mountain-mid);opacity:.75;}
  .mountain-near{fill:var(--mountain-near);}
  .trail-path{
    fill:none;
    stroke:var(--trail-edge);
    stroke-width:22;
    stroke-linecap:round;
  }
  .trail-path-inner{
    fill:none;
    stroke:var(--trail);
    stroke-width:14;
    stroke-linecap:round;
    stroke-dasharray:2 18;
  }
  .tree{opacity:.9;}
  /* flags */
  .flag-group{cursor:pointer;transition:filter .2s;}
  .flag-group .pole{stroke:#5a3d22;stroke-width:5;stroke-linecap:round;}
  .flag-group .cloth{transition:fill .3s;}
  .flag-group.done .cloth{fill:var(--correct) !important;}
  .flag-group .num{
    font-family:'Baloo 2',sans-serif;font-weight:800;font-size:20px;fill:#fff;
  }
  .flag-group.locked{opacity:.55;}
  .flag-pulse{
    animation:flagPulse 1.4s ease-in-out infinite;
    transform-origin:center;
  }
  @keyframes flagPulse{
    0%,100%{transform:scale(1);}
    50%{transform:scale(1.12);}
  }
  .summit-star{
    filter:drop-shadow(0 0 6px rgba(242,177,52,.8));
  }
  .summit-pulse{animation:flagPulse 1.6s ease-in-out infinite;transform-origin:center;}
  /* hiker */
  #hiker{
    position:absolute;
    width:6vh;height:6vh;
    font-size:5vh;
    line-height:6vh;
    text-align:center;
    transform:translate(-50%,-90%) scaleX(-1) rotate(-18deg);
    filter:drop-shadow(0 3px 4px rgba(0,0,0,.35));
    z-index:15;
    pointer-events:none;
    transition:none;
  }
  #hiker.bob{animation:bob .5s ease-in-out infinite;}
  @keyframes bob{
    0%,100%{margin-top:0;}
    50%{margin-top:-1.2vh;}
  }
  /* ---------- start overlay ---------- */
  #startOverlay{
    position:absolute;inset:0;z-index:30;
    background:linear-gradient(180deg,rgba(31,77,61,.92),rgba(20,45,34,.96));
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    color:#fff8ea;text-align:center;padding:4vh;
  }
  #startOverlay h1{
    font-family:'Baloo 2',sans-serif;font-weight:800;
    font-size:clamp(24px,5vh,48px);margin:0 0 1vh;
    letter-spacing:.02em;
  }
  #startOverlay p{font-size:clamp(13px,2.2vh,18px);max-width:60ch;opacity:.9;line-height:1.7;margin:0 0 3vh;}
  .btn-primary{
    font-family:'Baloo 2',sans-serif;font-weight:700;
    background:var(--accent-flag);color:#fff;border:none;
    padding:2vh 5vh;border-radius:50px;font-size:clamp(16px,2.6vh,22px);
    cursor:pointer;box-shadow:0 5px 0 #a83a1a,0 10px 18px rgba(0,0,0,.3);
    transition:transform .1s;
  }
  .btn-primary:active{transform:translateY(4px);box-shadow:0 1px 0 #a83a1a;}
  .btn-secondary{
    margin-top:2vh;
    background:transparent;color:#fff8ea;border:2px solid rgba(255,248,234,.5);
    padding:1.2vh 3vh;border-radius:50px;font-size:clamp(12px,1.8vh,16px);
    cursor:pointer;font-family:'Noto Sans TC',sans-serif;
  }
  /* ---------- question modal (trail sign) ---------- */
  #modalLayer{
    position:absolute;inset:0;z-index:25;
    display:none;
    align-items:center;justify-content:center;
    background:rgba(20,30,20,.35);
  }
  #modalLayer.show{display:flex;}
  #signCard{
    position:relative;
    background:var(--card-bg);
    width:min(72vh,92vw);
    max-width:640px;
    border-radius:10px;
    padding:3.4vh 3.6vh 3vh;
    box-shadow:0 4px 0 var(--wood-dark), 0 20px 40px rgba(0,0,0,.4);
    border:6px solid var(--wood);
    animation:signIn .35s cubic-bezier(.2,1.4,.4,1);
    max-height:88vh;
    overflow-y:auto;
  }
  @keyframes signIn{
    0%{transform:translateY(-16px) scale(.94);opacity:0;}
    100%{transform:translateY(0) scale(1);opacity:1;}
  }
  #signCard::before, #signCard::after{
    content:"";position:absolute;top:-2.2vh;width:1.6vh;height:2.6vh;
    background:var(--wood-dark);border-radius:2px;
  }
  #signCard::before{left:18%;transform:rotate(-8deg);}
  #signCard::after{right:18%;transform:rotate(8deg);}
  #stationLabel{
    font-family:'Baloo 2',sans-serif;font-weight:700;
    color:var(--accent-flag);font-size:clamp(12px,1.9vh,16px);
    letter-spacing:.06em;margin-bottom:.6vh;
  }
  #questionText{
    font-size:clamp(16px,2.6vh,23px);
    font-weight:700;line-height:1.55;margin:0 0 2.4vh;color:var(--ink);
  }
  #optionsWrap{display:flex;flex-direction:column;gap:1.4vh;}
  .opt-btn{
    text-align:left;
    font-family:'Noto Sans TC',sans-serif;
    font-size:clamp(14px,2vh,18px);
    padding:1.6vh 2vh;
    border:2px solid #d8c7a3;
    border-radius:8px;
    background:#fffdf6;
    cursor:pointer;
    color:var(--ink);
    display:flex;align-items:center;gap:1.2vh;
    transition:all .18s ease;
  }
  .opt-btn .opt-mark{
    flex:0 0 auto;width:2.6vh;height:2.6vh;border-radius:50%;
    background:#eee3c6;color:#8b6b3f;font-weight:800;font-size:1.4vh;
    display:flex;align-items:center;justify-content:center;
    font-family:'Baloo 2',sans-serif;
  }
  .opt-btn:active{transform:scale(.98);}
  .opt-btn.correct{
    background:#e6f7ea;border-color:var(--correct);
    box-shadow:0 0 0 3px rgba(63,174,87,.35), 0 0 18px rgba(63,174,87,.55);
  }
  .opt-btn.correct .opt-mark{background:var(--correct);color:#fff;}
  .opt-btn.wrong{
    background:#fdeceb;border-color:var(--wrong);
    box-shadow:0 0 0 3px rgba(230,72,58,.35), 0 0 18px rgba(230,72,58,.55);
    animation:shake .4s;
  }
  .opt-btn.wrong .opt-mark{background:var(--wrong);color:#fff;}
  @keyframes shake{
    0%,100%{transform:translateX(0);}
    20%{transform:translateX(-6px);}
    40%{transform:translateX(6px);}
    60%{transform:translateX(-4px);}
    80%{transform:translateX(4px);}
  }
  #feedbackLine{
    min-height:2.6vh;margin-top:1.6vh;font-size:clamp(12px,1.8vh,15px);
    font-weight:700;color:var(--wrong);
  }
  #feedbackLine.ok{color:var(--correct);}
  /* ---------- explanation button + panel ---------- */
  #showExplainBtn{
    display:none;
    margin:1.6vh auto 0;
    align-items:center;justify-content:center;gap:.7vh;
    background:#fff3d4;
    border:2px solid var(--accent-gold);
    color:#7a4a1a;
    font-family:'Noto Sans TC',sans-serif;
    font-weight:700;
    font-size:clamp(13px,1.9vh,16px);
    padding:1.2vh 2.4vh;
    border-radius:50px;
    cursor:pointer;
    transition:transform .1s, background .2s;
  }
  #showExplainBtn.show{display:flex;}
  #showExplainBtn:active{transform:scale(.97);}
  #explainPanel{display:none;}
  #explainPanel.show{display:block;}
  #explainTitle{
    font-family:'Baloo 2',sans-serif;font-weight:700;
    color:var(--forest-deep);
    font-size:clamp(15px,2.2vh,19px);
    display:flex;align-items:center;gap:.7vh;
    margin-bottom:1.2vh;
  }
  #explainText{
    font-size:clamp(14px,2vh,17px);
    line-height:1.85;
    color:var(--ink);
    background:#fffdf6;
    border:2px solid #e5d6ae;
    border-radius:10px;
    padding:2vh 2.2vh;
    margin-bottom:2.2vh;
    white-space:pre-line;
  }
  #explainDoneBtn{width:100%;}
  /* ---------- result overlay ---------- */
  #resultOverlay{
    position:absolute;inset:0;z-index:40;
    display:none;
    align-items:center;justify-content:center;
    background:linear-gradient(180deg,rgba(255,230,184,.2),rgba(20,45,34,.9) 55%);
  }
  #resultOverlay.show{display:flex;}
  #resultCard{
    background:var(--card-bg);
    border:6px solid var(--accent-gold);
    border-radius:14px;
    padding:4vh 5vh;
    text-align:center;
    box-shadow:0 20px 50px rgba(0,0,0,.45);
    max-width:80vw;
    animation:signIn .4s cubic-bezier(.2,1.4,.4,1);
  }
  #resultCard h2{
    font-family:'Baloo 2',sans-serif;font-size:clamp(24px,4.4vh,42px);
    color:var(--accent-flag);margin:0 0 1vh;
  }
  #resultCard p{font-size:clamp(13px,2vh,18px);margin:.4vh 0;color:var(--ink);}
  #resultStats{
    display:flex;gap:3vh;justify-content:center;margin:2.4vh 0;
    flex-wrap:wrap;
  }
  .stat{
    background:#fff;border-radius:10px;padding:1.6vh 2.4vh;
    box-shadow:0 3px 8px rgba(0,0,0,.12);min-width:12vh;
  }
  .stat b{display:block;font-family:'Baloo 2',sans-serif;font-size:clamp(18px,3vh,28px);color:var(--forest-deep);}
  .stat span{font-size:clamp(10px,1.5vh,13px);color:#7a6b4f;}
  #prizeBadge{
    display:inline-flex;align-items:center;gap:.8vh;
    margin:0 auto 2.6vh;
    background:linear-gradient(180deg,#fff3d4,#ffe6a8);
    border:2px dashed var(--accent-gold);
    border-radius:50px;
    padding:1.2vh 2.6vh;
    font-family:'Noto Sans TC',sans-serif;
    font-weight:700;
    font-size:clamp(13px,1.9vh,17px);
    color:#7a4a1a;
    box-shadow:0 3px 10px rgba(242,177,52,.35);
    animation:prizeGlow 1.6s ease-in-out infinite;
  }
  @keyframes prizeGlow{
    0%,100%{transform:scale(1);box-shadow:0 3px 10px rgba(242,177,52,.35);}
    50%{transform:scale(1.035);box-shadow:0 3px 16px rgba(242,177,52,.6);}
  }
  #confettiCanvas{position:absolute;inset:0;z-index:35;pointer-events:none;}
  @media (max-width:700px){
    #banner{font-size:12px;padding:.8vh 1.6vh;}
    .stat{min-width:9vh;padding:1.2vh 1.6vh;}
  }
</style>
</head>
<body>
<div id="stage">
  <div class="sun"></div>
  <div class="cloud" style="width:9vh;height:3.4vh;top:14%;left:8%;"></div>
  <div class="cloud" style="width:6vh;height:2.4vh;top:22%;left:20%;"></div>
  <div class="cloud" style="width:11vh;height:4vh;top:9%;left:55%;"></div>
  <svg id="trailSvg" viewBox="0 0 1000 600" preserveAspectRatio="xMidYMid slice">
    <!-- far mountain silhouette -->
    <path class="mountain-far" d="M0,420 L120,300 220,380 340,250 460,360 600,240 760,340 880,270 1000,360 1000,600 0,600 Z"/>
    <!-- mid mountain silhouette -->
    <path class="mountain-mid" d="M0,470 L150,360 300,430 430,320 560,420 720,300 860,400 1000,330 1000,600 0,600 Z"/>
    <!-- near mountain / ground -->
    <path class="mountain-near" d="M0,600 L0,520 100,470 220,520 360,440 480,500 600,410 740,470 860,400 1000,450 1000,600 Z"/>
    <!-- decorative trees -->
    <text class="tree" x="60" y="560" font-size="30">🌲</text>
    <text class="tree" x="150" y="500" font-size="24">🌲</text>
    <text class="tree" x="260" y="555" font-size="22">🌳</text>
    <text class="tree" x="420" y="470" font-size="26">🌲</text>
    <text class="tree" x="600" y="440" font-size="20">🌲</text>
    <text class="tree" x="760" y="380" font-size="22">🌲</text>
    <text class="tree" x="900" y="330" font-size="18">🌲</text>
    <!-- trail -->
    <path id="trailPath" class="trail-path"
      d="M80,540 C 200,520 150,400 320,380 C 480,360 380,260 520,240 C 650,220 580,140 720,120 C 830,105 780,60 900,40"/>
    <path class="trail-path-inner"
      d="M80,540 C 200,520 150,400 320,380 C 480,360 380,260 520,240 C 650,220 580,140 720,120 C 830,105 780,60 900,40"/>
    <!-- start marker -->
    <g>
      <circle cx="80" cy="540" r="10" fill="#fff" stroke="var(--forest-deep)" stroke-width="3"/>
      <text x="80" y="565" font-size="16" text-anchor="middle" fill="#2a4a3a" font-family="'Noto Sans TC',sans-serif" font-weight="700">起點</text>
    </g>
    <!-- flags (positions injected by JS) -->
    <g id="flagsLayer"></g>
    <!-- summit -->
    <g id="summitGroup">
      <text id="summitStar" class="summit-star" x="900" y="26" font-size="0" text-anchor="middle">⭐</text>
      <text x="900" y="18" font-size="13" text-anchor="middle" fill="#7a4a1a" font-family="'Noto Sans TC',sans-serif" font-weight="700">山頂</text>
    </g>
  </svg>
  <div id="hiker">🚶</div>
  <div id="banner"><span class="peg"></span>登山社博覽會・攻頂挑戰</div>
  <div id="progress"></div>
  <button id="fsBtn">⛶ 全螢幕展示</button>
  <div id="controlBar">
    <button class="ctrl-btn" id="playBtn">▶ 開始</button>
    <button class="ctrl-btn" id="pauseBtn" disabled>⏸ 暫停</button>
    <button class="ctrl-btn" id="restartCtrlBtn" disabled>🔄 重新遊戲</button>
  </div>
  <div id="pauseOverlay">
    <div id="pauseCard">
      <h3>⏸ 遊戲已暫停</h3>
      <p>按「▶ 開始／繼續」恢復挑戰</p>
    </div>
  </div>
  <!-- start overlay -->
  <div id="startOverlay">
    <h1>🏔️ 攻頂挑戰</h1>
    <p>沿著登山步道前進，途中會遇到 5 面關卡旗幟。答對問題才能繼續前進，答錯可以馬上重試——一起挑戰登頂，成為登山社的合格新血吧！</p>
    <button class="btn-primary" id="startBtn">開始挑戰 🚶</button>
  </div>
  <!-- question modal -->
  <div id="modalLayer">
    <div id="signCard">
      <div id="stationLabel">第 <span id="stationNum">1</span> 站關卡</div>
      <div id="quizPanel">
        <div id="questionText"></div>
        <div id="optionsWrap"></div>
        <div id="feedbackLine"></div>
        <button id="showExplainBtn">📖 看解析</button>
      </div>
      <div id="explainPanel">
        <div id="explainTitle">📖 解析小教室</div>
        <div id="explainText"></div>
        <button class="btn-primary" id="explainDoneBtn">閱讀完畢，繼續前進 🚶</button>
      </div>
    </div>
  </div>
  <!-- result overlay -->
  <div id="resultOverlay">
    <div id="resultCard">
      <h2>🎉 成功登頂！</h2>
      <p>恭喜完成登山社博覽會攻頂挑戰</p>
      <div id="resultStats">
        <div class="stat"><b id="statTime">0s</b><span>完成時間</span></div>
        <div class="stat"><b id="statWrong">0</b><span>答錯次數</span></div>
        <div class="stat"><b id="statRank">🥇</b><span>登頂等級</span></div>
      </div>
      <div id="prizeBadge">🎁 恭喜你完成啦!快去找關主領取小獎品吧！</div>
      <button class="btn-primary" id="restartBtn">再挑戰一次</button>
    </div>
  </div>
  <canvas id="confettiCanvas"></canvas>
</div>
<script>
(function(){
  "use strict";
  /* ---------------- data ---------------- */
  const QUESTIONS = [
    {
      station:"迷路應變",
      q:"爬山時如果不小心迷路，第一件該做的事是？",
      options:[
        "停在原地，冷靜評估並回想來時路",
        "拼命往前跑，趕快找出路",
        "順著溪谷往下走找水源，且往下走一定能走出去",
        "把手機關機以節省電力"
      ],
      correct:0,
      explain:"迷路時最容易犯的錯誤就是慌張亂走，反而讓自己離登山口越來越遠、體力耗盡。正確做法是「S.T.O.P.」原則：Stop（停下）、Think（思考）、Observe（觀察）、Plan（擬定計畫）。原地冷靜下來，回想最後確定方位的地點，必要時原路折返，並盡快撥打112求援。切勿沿溪谷下切，台灣地形陡峭，溪谷常有瀑布與峭壁，風險反而更高。"
    },
    {
      station:"登山精神",
      q:"登山常說的「LNT原則」主要是指什麼核心精神？",
      options:["不迷路原則","無痕山林，減少對自然的衝擊","絕對不獨自登山","裝備輕量化"],
      correct:1,
      explain:"LNT（Leave No Trace）無痕山林是國際通用的環境倫理準則，核心精神是「除了足跡，什麼都不留；除了照片，什麼都不取」。包含事先規劃行程、在承受力許可的地表上活動、確實處理垃圾與排遺、將發現的事物保留原狀、減少營火對環境的影響、尊重野生動植物，以及尊重其他山林使用者。目的是讓山林美景能永續留給下一代。"
    },
    {
      station:"裝備知識",
      q:"登山時穿著服裝常採用「洋蔥式穿法」，最內層最重要的功能是什麼？",
      options:["保暖蓄熱","防風防水","排汗透氣，保持皮膚乾爽","遮陽防曬"],
      correct:2,
      explain:"洋蔥式穿法分為三層：內層（排汗層）緊貼皮膚，主要功能是把汗水迅速排出、避免濕冷失溫，常用聚酯纖維或美麗諾羊毛材質，應避免棉質衣物，因為棉質吸濕後不易乾、容易造成失溫；中層（保暖層）如刷毛外套、羽絨，負責鎖住體溫；外層（防護層）則防風防水，抵擋風雨。三層可依氣溫與活動強度隨時增減，是登山保暖與安全的基本功。"
    },
    {
      station:"緊急應變",
      q:"當在山上遭遇雷雨時，以下哪一個是正確的躲避方式？",
      options:[
        "躲在孤立的樹下",
        "尋找低窪處並雙腳併攏蹲下",
        "立刻拿出手機打電話求救",
        "躲在山頂的涼亭內"
      ],
      correct:1,
      explain:"雷擊會優先打向地面最突出的物體，因此遭遇雷雨時應遠離孤立的樹木、電塔、稜線、山頂等制高點，尋找較低窪、開闊的地方，並讓金屬裝備（登山杖、相機腳架等）遠離身體。正確姿勢是雙腳併攏蹲下、降低身體高度並減少與地面的接觸面積，可蹲在背包或睡墊等隔絕物上，避免直接接觸潮濕地面，將雷擊傷害的風險降到最低。"
    },
    {
      station:"高山症處置",
      q:"隊友出現高山症初期症狀（頭痛、噁心、輕微嘔吐）時，最適當的處置是？",
      options:[
        "加快腳步儘速登頂",
        "給予大量咖啡因飲料提神",
        "忽略症狀，繼續前進",
        "停止上升、原地休息，並視情況下撤"
      ],
      correct:3,
      explain:"高山症的黃金原則是：出現症狀就不要再上升。頭痛、噁心、輕微嘔吐是急性高山反應（AMS）常見的初期徵兆，此時應立即停止上升海拔、多休息、補充水分，並密切觀察狀況。若症狀持續惡化（如嚴重頭痛、意識不清、走路不穩、呼吸困難），必須立刻下撤到較低海拔，這是唯一有效且必要的處置方式，千萬別用「撐過去就好」的心態勉強繼續攻頂。"
    }
  ];
  const FLAG_FRACS = [0.16, 0.34, 0.52, 0.70, 0.88];
  /* ---------------- refs ---------------- */
  const svg = document.getElementById('trailSvg');
  const path = document.getElementById('trailPath');
  const flagsLayer = document.getElementById('flagsLayer');
  const hiker = document.getElementById('hiker');
  const progressBar = document.getElementById('progress');
  const modalLayer = document.getElementById('modalLayer');
  const signCard = document.getElementById('signCard');
  const quizPanel = document.getElementById('quizPanel');
  const explainPanel = document.getElementById('explainPanel');
  const explainText = document.getElementById('explainText');
  const showExplainBtn = document.getElementById('showExplainBtn');
  const explainDoneBtn = document.getElementById('explainDoneBtn');
  const questionText = document.getElementById('questionText');
  const optionsWrap = document.getElementById('optionsWrap');
  const feedbackLine = document.getElementById('feedbackLine');
  const startOverlay = document.getElementById('startOverlay');
  const startBtn = document.getElementById('startBtn');
  const resultOverlay = document.getElementById('resultOverlay');
  const restartBtn = document.getElementById('restartBtn');
  const fsBtn = document.getElementById('fsBtn');
  const summitStar = document.getElementById('summitStar');
  const playBtn = document.getElementById('playBtn');
  const pauseBtn = document.getElementById('pauseBtn');
  const restartCtrlBtn = document.getElementById('restartCtrlBtn');
  const pauseOverlay = document.getElementById('pauseOverlay');
  const totalLen = path.getTotalLength();
  /* ---------------- state ---------------- */
  let currentFrac = 0;      // hiker's current position along path (0-1)
  let flagIndex = 0;        // next uncompleted flag
  let wrongCount = 0;
  let busy = false;
  let paused = false;
  let playElapsed = 0;      // ms of actual play time, excludes paused time
  let openQIndex = null;    // index of the question currently shown in the modal
  // gameState: 'idle' | 'running' | 'paused' | 'finished'
  let gameState = 'idle';
  /* ---------------- build flags ---------------- */
  const flagEls = [];
  FLAG_FRACS.forEach((frac, i)=>{
    const pt = path.getPointAtLength(frac*totalLen);
    const g = document.createElementNS('http://www.w3.org/2000/svg','g');
    g.setAttribute('class','flag-group locked');
    g.setAttribute('data-index', i);
    g.innerHTML = `
      <g class="pulse-wrap flag-pulse">
        <line class="pole" x1="${pt.x}" y1="${pt.y+2}" x2="${pt.x}" y2="${pt.y-34}"></line>
        <path class="cloth" d="M${pt.x},${pt.y-34} L${pt.x+26},${pt.y-27} L${pt.x},${pt.y-19} Z" fill="var(--accent-flag)"></path>
        <text class="num" x="${pt.x+2}" y="${pt.y-24}">${i+1}</text>
      </g>`;
    flagsLayer.appendChild(g);
    flagEls.push(g);
  });
  /* progress dots */
  const dotEls = [];
  FLAG_FRACS.forEach((f,i)=>{
    const d = document.createElement('div');
    d.className = 'dot';
    d.textContent = (i+1);
    progressBar.appendChild(d);
    dotEls.push(d);
  });
  function refreshProgress(){
    dotEls.forEach((d,i)=>{
      d.classList.toggle('done', i < flagIndex);
      d.classList.toggle('active', i === flagIndex);
    });
    flagEls.forEach((g,i)=>{
      g.classList.toggle('locked', i > flagIndex);
      g.classList.toggle('done', i < flagIndex);
      const pulse = g.querySelector('.pulse-wrap');
      if(i === flagIndex){ pulse.classList.add('flag-pulse'); }
      else { pulse.classList.remove('flag-pulse'); }
    });
  }
  refreshProgress();
  /* ---------------- hiker placement ---------------- */
  function placeHiker(frac){
    const pt = path.getPointAtLength(frac*totalLen);
    const svgRect = svg.getBoundingClientRect();
    // viewBox is 1000x600 with preserveAspectRatio="xMidYMid slice" (like object-fit:cover):
    // the SVG scales uniformly and centers/crops, so left/top must replicate that exact
    // transform (independent X/Y scaling would drift the hiker off the actual path).
    const scale = Math.max(svgRect.width/1000, svgRect.height/600);
    const offsetX = (svgRect.width - 1000*scale)/2;
    const offsetY = (svgRect.height - 600*scale)/2;
    hiker.style.left = (pt.x*scale + offsetX) + 'px';
    hiker.style.top = (pt.y*scale + offsetY) + 'px';
  }
  placeHiker(0);
  window.addEventListener('resize', ()=>placeHiker(currentFrac));
  function easeInOutQuad(t){ return t<0.5 ? 2*t*t : 1-Math.pow(-2*t+2,2)/2; }
  /* Pause-aware animation engine: a single perpetual rAF loop drives both the
     hiker's walk tween and the play-time clock, advancing only while
     gameState === 'running' (i.e. not paused). */
  let anim = null; // {from, to, duration, elapsed, onDone}
  let lastTick = null;
  function walkTo(targetFrac, duration, onDone){
    busy = true;
    hiker.classList.add('bob');
    anim = { from: currentFrac, to: targetFrac, duration, elapsed: 0, onDone };
  }
  function tick(now){
    if(lastTick === null) lastTick = now;
    const dt = now - lastTick;
    lastTick = now;
    if(gameState === 'running'){
      playElapsed += dt;
      if(anim){
        anim.elapsed += dt;
        const p = Math.min(1, anim.elapsed/anim.duration);
        const eased = easeInOutQuad(p);
        currentFrac = anim.from + (anim.to-anim.from)*eased;
        placeHiker(currentFrac);
        if(p >= 1){
          currentFrac = anim.to;
          placeHiker(currentFrac);
          hiker.classList.remove('bob');
          busy = false;
          const cb = anim.onDone;
          anim = null;
          if(cb) cb();
        }
      }
    }
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
  /* ---------------- modal / quiz ---------------- */
  function openQuestion(i){
    openQIndex = i;
    const data = QUESTIONS[i];
    document.getElementById('stationLabel').innerHTML =
      `第 <span id="stationNum">${i+1}</span> 站關卡・⛳ ${data.station}`;
    questionText.textContent = data.q;
    optionsWrap.innerHTML = '';
    feedbackLine.textContent = '';
    feedbackLine.classList.remove('ok');
    showExplainBtn.classList.remove('show');
    quizPanel.style.display = 'block';
    explainPanel.classList.remove('show');
    signCard.scrollTop = 0;
    data.options.forEach((optText, idx)=>{
      const btn = document.createElement('button');
      btn.className = 'opt-btn';
      btn.innerHTML = `<span class="opt-mark">${String.fromCharCode(65+idx)}</span><span>${optText}</span>`;
      btn.addEventListener('click', ()=>handleAnswer(idx, data.correct, btn, i));
      optionsWrap.appendChild(btn);
    });
    modalLayer.classList.add('show');
  }
  function closeQuestion(){
    modalLayer.classList.remove('show');
  }
  let locked = false;
  function handleAnswer(chosen, correct, btnEl, qIndex){
    if(locked || gameState !== 'running') return;
    if(chosen === correct){
      locked = true;
      btnEl.classList.add('correct');
      feedbackLine.textContent = '✔ 答對了！看看解析，了解得更清楚吧～';
      feedbackLine.classList.add('ok');
      Array.from(optionsWrap.children).forEach(b=>{ if(b!==btnEl) b.style.opacity='.5'; });
      // 不再自動倒數關閉：等使用者看完解析、按下「閱讀完畢」才繼續前進
      showExplainBtn.classList.add('show');
    } else {
      btnEl.classList.add('wrong');
      wrongCount++;
      feedbackLine.textContent = '✘ 再想想看，答錯囉！';
      feedbackLine.classList.remove('ok');
      setTimeout(()=>{ btnEl.classList.remove('wrong'); }, 500);
    }
  }
  /* ---------------- explanation flow ---------------- */
  showExplainBtn.addEventListener('click', ()=>{
    if(openQIndex === null) return;
    explainText.textContent = QUESTIONS[openQIndex].explain;
    quizPanel.style.display = 'none';
    explainPanel.classList.add('show');
    signCard.scrollTop = 0;
  });
  explainDoneBtn.addEventListener('click', ()=>{
    if(gameState !== 'running') return;
    closeQuestion();
    locked = false;
    advanceAfterCorrect();
  });
  function advanceAfterCorrect(){
    flagIndex++;
    refreshProgress();
    if(flagIndex < FLAG_FRACS.length){
      const nextIdx = flagIndex;
      walkTo(FLAG_FRACS[flagIndex], 1400, ()=>{
        setTimeout(()=>{ if(gameState==='running') openQuestion(nextIdx); }, 250);
      });
    } else {
      // last flag done -> walk to summit
      walkTo(1.0, 1600, ()=>{
        reachSummit();
      });
    }
  }
  /* ---------------- flag click (optional manual trigger if reached) ---------------- */
  flagEls.forEach((g,i)=>{
    g.addEventListener('click', ()=>{
      if(busy || locked || gameState !== 'running') return;
      if(i === flagIndex && Math.abs(currentFrac - FLAG_FRACS[i]) < 0.001){
        openQuestion(i);
      }
    });
  });
  /* ---------------- start / pause / restart control ---------------- */
  function updateControlButtons(){
    playBtn.disabled = (gameState === 'running' || gameState === 'finished');
    pauseBtn.disabled = (gameState !== 'running');
    restartCtrlBtn.disabled = (gameState === 'idle');
    playBtn.textContent = gameState === 'paused' ? '▶ 繼續' : '▶ 開始';
  }
  function beginJourney(){
    startOverlay.style.display = 'none';
    gameState = 'running';
    summitStar.setAttribute('font-size','26');
    summitStar.classList.add('summit-pulse');
    updateControlButtons();
    walkTo(FLAG_FRACS[0], 1400, ()=>{
      setTimeout(()=>{ if(gameState==='running') openQuestion(0); }, 250);
    });
  }
  function startOrResume(){
    if(gameState === 'idle'){
      beginJourney();
    } else if(gameState === 'paused'){
      gameState = 'running';
      pauseOverlay.classList.remove('show');
      updateControlButtons();
    }
  }
  function pauseGame(){
    if(gameState !== 'running') return;
    gameState = 'paused';
    pauseOverlay.classList.add('show');
    updateControlButtons();
  }
  function restartGame(){
    anim = null;
    busy = false;
    locked = false;
    paused = false;
    playElapsed = 0;
    flagIndex = 0;
    wrongCount = 0;
    currentFrac = 0;
    openQIndex = null;
    placeHiker(0);
    closeQuestion();
    resultOverlay.classList.remove('show');
    pauseOverlay.classList.remove('show');
    refreshProgress();
    summitStar.classList.remove('summit-pulse');
    summitStar.setAttribute('font-size','0');
    gameState = 'idle';
    updateControlButtons();
    startOverlay.style.display = 'flex';
  }
  playBtn.addEventListener('click', startOrResume);
  pauseBtn.addEventListener('click', pauseGame);
  restartCtrlBtn.addEventListener('click', restartGame);
  startBtn.addEventListener('click', startOrResume);
  restartBtn.addEventListener('click', restartGame);
  updateControlButtons();
  /* ---------------- summit + confetti ---------------- */
  function reachSummit(){
    gameState = 'finished';
    updateControlButtons();
    const elapsed = Math.round(playElapsed/1000);
    document.getElementById('statTime').textContent = elapsed + ' 秒';
    document.getElementById('statWrong').textContent = wrongCount + ' 次';
    let rank = '🥇 神腳健將';
    if(wrongCount >= 5) rank = '🥉 平安登頂';
    else if(wrongCount >= 2) rank = '🥈 穩健山友';
    document.getElementById('statRank').textContent = rank;
    resultOverlay.classList.add('show');
    launchConfetti();
  }
  /* ---------------- fullscreen ---------------- */
  fsBtn.addEventListener('click', ()=>{
    const el = document.documentElement;
    if(!document.fullscreenElement){
      if(el.requestFullscreen) el.requestFullscreen();
      fsBtn.textContent = '⛶ 結束全螢幕';
    } else {
      if(document.exitFullscreen) document.exitFullscreen();
      fsBtn.textContent = '⛶ 全螢幕展示';
    }
  });
  document.addEventListener('fullscreenchange', ()=>{
    fsBtn.textContent = document.fullscreenElement ? '⛶ 結束全螢幕' : '⛶ 全螢幕展示';
  });
  /* ---------------- confetti ---------------- */
  const canvas = document.getElementById('confettiCanvas');
  const ctx = canvas.getContext('2d');
  let confettiParticles = [];
  let confettiRAF = null;
  function resizeCanvas(){
    canvas.width = canvas.clientWidth * devicePixelRatio;
    canvas.height = canvas.clientHeight * devicePixelRatio;
    ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
  }
  resizeCanvas();
  window.addEventListener('resize', resizeCanvas);
  const CONFETTI_COLORS = ['#e8542a','#f2b134','#3fae57','#4a8fe0','#c9557f','#ffffff','#356153'];
  function launchConfetti(){
    const w = canvas.clientWidth, h = canvas.clientHeight;
    confettiParticles = [];
    const count = 160;
    for(let i=0;i<count;i++){
      confettiParticles.push({
        x: Math.random()*w,
        y: -20 - Math.random()*h*0.5,
        vx: (Math.random()-0.5)*2.2,
        vy: 2 + Math.random()*3,
        size: 5 + Math.random()*7,
        rot: Math.random()*360,
        vr: (Math.random()-0.5)*10,
        color: CONFETTI_COLORS[Math.floor(Math.random()*CONFETTI_COLORS.length)],
        shape: Math.random()<0.5 ? 'rect' : 'circle',
        life: 0,
        maxLife: 260 + Math.random()*120
      });
    }
    if(confettiRAF) cancelAnimationFrame(confettiRAF);
    animateConfetti();
  }
  function animateConfetti(){
    const w = canvas.clientWidth, h = canvas.clientHeight;
    ctx.clearRect(0,0,w,h);
    let alive = false;
    confettiParticles.forEach(p=>{
      p.life++;
      if(p.life > p.maxLife) return;
      alive = true;
      p.x += p.vx;
      p.y += p.vy;
      p.vy += 0.02;
      p.rot += p.vr;
      const fade = p.life > p.maxLife-40 ? Math.max(0,(p.maxLife-p.life)/40) : 1;
      ctx.save();
      ctx.translate(p.x,p.y);
      ctx.rotate(p.rot*Math.PI/180);
      ctx.globalAlpha = fade;
      ctx.fillStyle = p.color;
      if(p.shape==='rect'){
        ctx.fillRect(-p.size/2,-p.size/3,p.size,p.size*0.66);
      } else {
        ctx.beginPath();
        ctx.arc(0,0,p.size/2,0,Math.PI*2);
        ctx.fill();
      }
      ctx.restore();
    });
    if(alive){
      confettiRAF = requestAnimationFrame(animateConfetti);
    } else {
      ctx.clearRect(0,0,w,h);
      // gentle re-trigger a lighter burst periodically while result screen open
      if(resultOverlay.classList.contains('show')){
        setTimeout(()=>{ if(resultOverlay.classList.contains('show')) launchConfetti(); }, 1800);
      }
    }
  }
})();
</script>
</body>
